server:
    port: 8084

spring:
    application:
        name: content-service

    datasource:
        url: jdbc:postgresql://localhost:5432/content_service_db
        username: postgres
        password: your_password
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
                format_sql: true

    elasticsearch:
        uris: http://localhost:9200
        connection-timeout: 5s
        socket-timeout: 30s

    cloud:
        consul:
            enabled: false
            discovery:
                enabled: false

jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

management:
    endpoints:
        web:
            exposure:
                include: health,info,metrics
    endpoint:
        health:
            show-details: always